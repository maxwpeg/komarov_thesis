[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "uploads",
    "outputs",
    "debug_output",
    "storage_objects",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "floorplan", "pdf_documents", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.alembic]
script_location = "alembic"
